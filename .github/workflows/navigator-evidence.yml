name: Navigator evidence check

on:
  pull_request:
    paths:
      - 'assets/product/navigator.js'
      - 'assets/product/organizations.json'
      - 'dist/assets/product/navigator.js'
      - 'dist/assets/product/organizations.json'
      - 'scripts/validate-navigator-evidence.mjs'
      - '.github/workflows/navigator-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'assets/product/navigator.js'
      - 'assets/product/organizations.json'
      - 'dist/assets/product/navigator.js'
      - 'dist/assets/product/organizations.json'
      - 'scripts/validate-navigator-evidence.mjs'
      - '.github/workflows/navigator-evidence.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate evidence records
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-navigator-evidence.mjs
